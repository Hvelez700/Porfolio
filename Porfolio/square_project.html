<html>
<head><title>Spuare Project</title></head>

<style>

#box{
width: 100px;
height: 100px;
background-color:red;
border-radius: 10px;
transition: 1s ease-in-out;
}
#box:hover{
transform: translate(50px, 50px);
}

.box2{

width: 100px;
height: 100px;
background-color:blue;
border-radius: 10px;
transition: 1s linear;
}

.box2:hover{
transform: translate(50px, 50px);
}

.box3{
width: 100px;
height: 100px;
background-color:green;
border-radius: 10px;
transition-property: transform;
transition-duration: 1s;
}

.box3:hover{
animation-name: rotate;
animation-duration: 2s; 
animation-iteration-count: infinite;
animation-timing-function: linear;
}

@keyframes rotate {
    from {transform: rotate(0deg);}
    to {transform: rotate(360deg);}
}



.box4{
width: 100px;
height: 100px;
background-color:black;
border-radius: 10px;
transition: 1s ease-in-out;
position:relative;
margin-left:50%;
}

.box4:hover{
transform: scale(4,4);
}

.box5{
width: 100px;
height: 100px;
background-color:rgb(90,123,77);
border-radius: 10px;
transition: 1s ease-in-out;
}
.box5:hover{
transform: rotate(45deg);
}

.box6{
width: 100px;
height: 100px;
background-color:rgb(185,120,177);
border-radius: 10px;
transition: 1s ease-in-out;
}
.box6:hover{
transform: skew(20deg, 30deg);
}
.box7{
width: 100px;
height: 100px;
background-color:rgb(210,101,155);
border-radius: 10px;
transition: 1s ease-in-out;
font-family: "arial";
display: flex;
align-items: center;
justify-content: center;
font-size: 200%;
}

.box7:hover{

transform: rotatez(180deg);
}
<!--
transform: rotatex(180deg);
transform: rotatey(180deg);
-->







</style>



<body>
<div id="box"></div>

<div class="box2"></div>
<div class="box3"></div>
<div class="box4"></div>
<div class="box5"></div>
<div class="box6"></div>
<div class="box7">BOX</div>
<div class="box8"></div>
<h1><a href="Project.html">Take me back to Project Page</a></h1>


</body>

</html>
